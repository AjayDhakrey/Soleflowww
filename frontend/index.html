<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoleFlow — B2B Footwear Trade Management &amp; CRM</title>
    <meta name="description" content="Enterprise B2B Footwear Trade Management &amp; CRM Web Application for wholesale shoe distributors, manufacturers, and sales teams." />
    <meta property="og:title" content="SoleFlow — B2B Footwear Trade Management &amp; CRM" />
    <meta property="og:description" content="Enterprise B2B Footwear Trade Management &amp; CRM Web Application for wholesale shoe distributors, manufacturers, and sales teams." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" />
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            if (!window.crypto) window.crypto = {};
            if (typeof window.crypto.randomUUID !== 'function') {
              window.crypto.randomUUID = function() {
                if (typeof window.crypto.getRandomValues === 'function') {
                  try {
                    return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function(c) {
                      return (c ^ (window.crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16);
                    });
                  } catch (e) {}
                }
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                  var r = (Math.random() * 16) | 0;
                  var v = c === 'x' ? r : (r & 0x3) | 0x8;
                  return v.toString(16);
                });
              };
            }
          }
        } catch (e) {}
        try {
          var storedTheme = localStorage.getItem('soleflow_theme');
          if (!storedTheme) {
            var oldDark = localStorage.getItem('soleflow_dark_mode');
            if (oldDark === 'true') {
              storedTheme = 'dark';
            } else {
              storedTheme = 'light';
            }
          }
          var isDark = false;
          if (storedTheme === 'dark') {
            isDark = true;
          } else if (storedTheme === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
